# Harness Memory team-memory configuration.
#
# Copy this file to the config folder and keep it private, it holds the database credentials:
#   Linux    $XDG_CONFIG_HOME/harness-memory/config.toml (default ~/.config/harness-memory/config.toml)
#   macOS    ~/Library/Application Support/harness-memory/config.toml
#   Windows  %APPDATA%\harness-memory\config.toml
#   any OS   the path in HARNESS_MEMORY_CONFIG
#   chmod 600 ~/.config/harness-memory/config.toml
#
# HARNESS_MEMORY_DATABASE_URL and HARNESS_MEMORY_DATABASE_TOKEN override the values below. Without a database_url the
# server uses its local SQLite file. HARNESS_MEMORY_DATABASE_KIND goes with HARNESS_MEMORY_DATABASE_URL only, and
# database_kind below with database_url only.

# Pick one URL.

# PostgreSQL. TLS is required for every host but localhost.
database_url = "postgres://harness_memory:CHANGE-ME@db.example.com:5432/harness_memory?sslmode=require"

# libSQL: a self-hosted sqld (libsql:// or https://, http:// only for localhost) or Turso.
# database_url = "libsql://your-database.turso.io"
# database_token = "CHANGE-ME"

# MongoDB. The database is the URL path (harness_memory when there is none). Transactions need a replica set.
# database_url = "mongodb+srv://harness_memory:CHANGE-ME@cluster.example.com/harness_memory?retryWrites=true"

# Amazon DocumentDB: the connection string the AWS console shows, as it is (connect to your VPN first). A host under
# docdb.amazonaws.com is taken for DocumentDB by itself, tlsCAFile=global-bundle.pem means the Amazon certificate bundle
# built into harness-memory, and the notes go to the harness_memory database.
# database_url = "mongodb://harness_memory:CHANGE-ME@docs.cluster-abc123.eu-central-1.docdb.amazonaws.com:27017/?tls=true&tlsCAFile=global-bundle.pem&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"
# Which server a mongodb:// URL names: "mongodb" or "documentdb". Only needed for DocumentDB under another host name,
# or "mongodb" to turn the detection off.
# database_kind = "documentdb"

# Which notes go to the team database: "remote" (the default) or "local" to keep that kind on this computer.
# HARNESS_MEMORY_REPOSITORY_NOTES and HARNESS_MEMORY_GLOBAL_NOTES override them.
# repository_notes = "remote"
# global_notes = "local"

# Whether a scope set to "remote" (and "remote+local") is read and saved on this computer while the team database
# cannot be reached, and what was saved there is copied to the team database when it is back. On by default; set
# false to never keep notes or scripts on this computer. HARNESS_MEMORY_OFFLINE_FALLBACK overrides it.
# offline_fallback = true

# Whether Harness Desktop hooks are shared through the team database: "remote", or "local" (the default) to share none.
# trust_team_hooks = true lets Harness Desktop run team hooks without your approval: whoever can write to the team
# database (any process running as a teammate can run `harness-memory hooks put`) can then run commands on your
# computer, so leave it off unless you trust everyone with access to the team database.
# HARNESS_MEMORY_HOOKS and HARNESS_MEMORY_TRUST_TEAM_HOOKS override them.
# hooks = "remote"
# trust_team_hooks = false

# Whether Harness Desktop routines are shared through the team database: "remote", or "local" (the default) to share
# none. A team routine arrives turned off: it runs only on computers where someone turned it on. trust_team_routines =
# true then runs it without approving each version: whoever can write to the team database can then run commands and
# agents on your computer, so leave it off unless you trust everyone with access to the team database.
# HARNESS_MEMORY_ROUTINES and HARNESS_MEMORY_TRUST_TEAM_ROUTINES override them.
# routines = "remote"
# trust_team_routines = false
