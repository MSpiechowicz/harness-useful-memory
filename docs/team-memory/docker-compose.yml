# Team-memory backends for a local trial: PostgreSQL, libSQL (sqld) and MongoDB.
# Every port is published on 127.0.0.1 only and there is no TLS, so this is for trying things out on one machine,
# not for sharing with a team. See "Team memory" in the README for a real setup.
#
#   docker compose -f docs/team-memory/docker-compose.yml up -d --wait postgres
#   export HARNESS_MEMORY_DATABASE_URL='postgres://postgres:trial@localhost:5432/postgres?sslmode=disable'
#
#   docker compose -f docs/team-memory/docker-compose.yml up -d --wait libsql
#   export HARNESS_MEMORY_DATABASE_URL='http://localhost:8080'
#
#   docker compose -f docs/team-memory/docker-compose.yml up -d --wait mongo
#   export HARNESS_MEMORY_DATABASE_URL='mongodb://localhost:27017/harness_memory?replicaSet=rs0&directConnection=true'
#
# Remove the containers and their data with: docker compose -f docs/team-memory/docker-compose.yml down -v
#
# The images are pinned by digest; the comment next to each names the tag it was taken from.

name: harness-memory-team

services:
  postgres:
    image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # postgres:17
    environment:
      POSTGRES_PASSWORD: ${HARNESS_MEMORY_TRIAL_POSTGRES_PASSWORD:-trial}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  libsql:
    image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67 # libsql-server:latest
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_DB_PATH: /var/lib/sqld/data.sqld
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - libsql-data:/var/lib/sqld
    healthcheck:
      # The image has no curl or wget, so ask /health through bash.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo@sha256:d0c8f51bb63fb1f992f4ff05293adb3f0967aaaae32c3e5fa567907800819b3b # mongo:8
    # Transactions need a replica set, so run a single-node one. The healthcheck initiates it on first start.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          try { rs.status() } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }) }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  libsql-data:
  mongo-data:
