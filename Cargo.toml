[package]
name = "harness_memory"
description = "Project memory MCP server for any coding agent harness (embedded SQLite, full-text search)"
version = "1.2.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/MSpiechowicz/harness-useful-memory"
publish = false

[lib]
path = "src/lib.rs"

# The stdio MCP server the harnesses' `mcp.json` entries start (`harness-memory` or `harness-memory mcp`).
[[bin]]
name = "harness-memory"
path = "src/main.rs"
doc = false

[dependencies]
# SQLite compiled in (FTS5 included), so no system library is needed.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`: tool schemas and replies keep their keys in source order.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
# The SHA-256 of a script body, which names the version a machine trusts.
sha2 = "0.11.1"
regex = "1.13"
# Canonical paths without the Windows `\\?\` prefix.
dunce = "1.0.5"
# The team database config file (`<config dir>/harness-memory/config.toml`).
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# The PostgreSQL team backend: the synchronous client, TLS through rustls with the ring provider
# (no OpenSSL), and the platform's trusted roots.
postgres = "0.19.14"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
# Accent folding for the PostgreSQL full-text index (SQLite's FTS5 does it itself).
unicode-normalization = "0.1.25"
# The MongoDB team backend: the official driver's blocking API, TLS through rustls with ring (no
# OpenSSL), DNS for `mongodb+srv://` seed lists.
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver", "sync"] }
# The libSQL team backend (sqld, Turso): a blocking HTTP client for the Hrana pipeline API, TLS
# through the rustls (ring) and platform roots above, no gzip.
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider"] }
# The private folder a script body is written to for its run.
tempfile = "3.27.0"
# The id of a script run request, from the operating system's random source (the version the
# MongoDB driver's DNS resolver already pulls in).
getrandom = "0.4.3"

# Kills a timed-out git together with its process group (`killpg`).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "user"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
pretty_assertions = "1.4"
tempfile = "3.27.0"

# A terminal for `harness-memory trust <id>` in the tests (it refuses to run without one).
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["term"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
strip = true
