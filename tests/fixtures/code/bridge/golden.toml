# A constant shared by a few definitions bridges `code_path` from the definition that sends or sets it to the
# ones that handle it: a `case` label or an equality test on it. A definition that only passes the constant
# on as an argument (a log line, a format) is no handler, and the chain does not run through it.
# Every fact was read from the files of this folder.

# ---- Go --------------------------------------------------------------------------------------------------

[[path]]
from = "GoSend"
to = "GoHandle"
note = "GoSend sets EvtGoPing (events.go:8) and GoHandle has `case EvtGoPing:` (:19)"
hops = 2
through = ["GoSend", "EvtGoPing", "GoHandle"]

[[path]]
from = "GoSend"
to = "GoIsPing"
note = "GoIsPing compares kind == EvtGoPing (events.go:28)"
hops = 2
through = ["GoSend", "EvtGoPing", "GoIsPing"]

[[path]]
from = "GoSend"
to = "GoLog"
note = "GoLog only passes EvtGoPing on as an argument (events.go:13): it handles nothing, so nothing leads there"
text_only = true
contains = ["no chain within 6 hops between `GoSend` and `GoLog`"]
not_contains = ["→ GoLog"]

